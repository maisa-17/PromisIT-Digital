<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="100%" height="100%">
  <defs>
    <!-- 3D Lighting & Shadow Gradients -->
    <linearGradient id="p3dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="d3dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD1D9" />
      <stop offset="50%" stop-color="#FF8A9E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <linearGradient id="overlap3dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7D2FE" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Drop Shadow Filter for 3D depth -->
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="12" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.25" />
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>

    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feComponentTransfer in="SourceAlpha">
        <feFuncA type="linear" slope="0.7"/>
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feOffset dx="-2" dy="-2"/>
      <feComposite operator="out" in2="SourceAlpha" result="inverse"/>
      <feFlood flood-color="white" flood-opacity="0.6" result="color"/>
      <feComposite operator="in" in2="inverse" result="shadow"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>

    <style>
      .title-3d { font-family: 'Montserrat', 'Inter', sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.22em; fill: #0F172A; text-anchor: middle; }
      .sub-3d { font-family: 'Montserrat', 'Inter', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.38em; fill: #334155; text-anchor: middle; }
    </style>
  </defs>

  <!-- 3D LOGO MARK WITH SHADOWS -->
  <g transform="translate(100, 30)" filter="url(#shadow3d)">
    <!-- Right D Shape (Coral Pink 3D) -->
    <path d="M 120 20 L 170 20 C 235 20 270 65 270 130 C 270 195 235 240 170 240 L 120 240 L 120 185 L 165 185 C 195 185 215 165 215 130 C 215 95 195 75 165 75 L 120 75 Z" fill="url(#d3dGrad)"/>

    <!-- Left P Main Body (Sky Blue 3D) -->
    <path d="M 30 20 C 30 20 100 20 130 20 C 175 20 205 50 205 95 C 205 140 175 170 130 170 L 80 170 L 80 240 L 30 240 Z" fill="url(#p3dGrad)"/>
    <path d="M 80 65 L 125 65 C 140 65 155 75 155 95 C 155 115 140 125 125 125 L 80 125 Z" fill="#FFFFFF"/>

    <!-- Interlocking Overlap Box (Purple 3D) -->
    <rect x="80" y="125" width="45" height="45" fill="url(#overlap3dGrad)" rx="2"/>

    <!-- Subtle Bevel Highlights -->
    <path d="M 30 20 L 130 20 C 160 20 185 35 195 60 C 180 35 155 25 130 25 L 35 25 L 35 240 L 30 240 Z" fill="#FFFFFF" opacity="0.4"/>
  </g>

  <!-- TYPOGRAPHY -->
  <text x="250" y="380" class="title-3d">PROMISIT</text>
  <text x="250" y="420" class="sub-3d">DIGITAL SOLUTIONS</text>
</svg>
