<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="100%" height="100%">
  <defs>
    <!-- CMYK printable solid tones with subtle embossed 3D depth -->
    <filter id="emboss3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="3" flood-color="#1E293B" flood-opacity="0.2" />
    </filter>
    <style>
      .print-title { font-family: 'Montserrat', 'Inter', sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.22em; fill: #000000; text-anchor: middle; }
      .print-sub { font-family: 'Montserrat', 'Inter', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.38em; fill: #1E293B; text-anchor: middle; }
    </style>
  </defs>

  <g transform="translate(100, 30)" filter="url(#emboss3d)">
    <!-- Right D (CMYK Safe Coral) -->
    <path d="M 120 20 L 170 20 C 235 20 270 65 270 130 C 270 195 235 240 170 240 L 120 240 L 120 185 L 165 185 C 195 185 215 165 215 130 C 215 95 195 75 165 75 L 120 75 Z" fill="#F43F5E"/>
    <!-- Left P (CMYK Safe Cyan/Blue) -->
    <path d="M 30 20 C 30 20 100 20 130 20 C 175 20 205 50 205 95 C 205 140 175 170 130 170 L 80 170 L 80 240 L 30 240 Z" fill="#0284C7"/>
    <path d="M 80 65 L 125 65 C 140 65 155 75 155 95 C 155 115 140 125 125 125 L 80 125 Z" fill="#FFFFFF"/>
    <!-- Interlocking Box (CMYK Safe Violet) -->
    <rect x="80" y="125" width="45" height="45" fill="#6D28D9"/>
  </g>

  <!-- 100% Solid Black Text for Sharp Physical Printing -->
  <text x="250" y="380" class="print-title">PROMISIT</text>
  <text x="250" y="420" class="print-sub">DIGITAL SOLUTIONS</text>
</svg>
