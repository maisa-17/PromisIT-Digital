<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0B0F17"/>
  <defs>
    <!-- Glowing 3D Gradients for Dark Mode -->
    <linearGradient id="pDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="dDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <linearGradient id="overlapDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Ambient Backlight Glow + Drop Shadow -->
    <filter id="darkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#38BDF8" flood-opacity="0.35" />
      <feDropShadow dx="8" dy="14" stdDeviation="10" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <style>
      .dark-title-3d { font-family: 'Montserrat', 'Inter', sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.22em; fill: #FFFFFF; text-anchor: middle; }
      .dark-sub-3d { font-family: 'Montserrat', 'Inter', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.38em; fill: #94A3B8; text-anchor: middle; }
    </style>
  </defs>

  <g transform="translate(100, 30)" filter="url(#darkGlow)">
    <!-- Right D Shape -->
    <path d="M 120 20 L 170 20 C 235 20 270 65 270 130 C 270 195 235 240 170 240 L 120 240 L 120 185 L 165 185 C 195 185 215 165 215 130 C 215 95 195 75 165 75 L 120 75 Z" fill="url(#dDarkGrad)"/>

    <!-- Left P Main Body -->
    <path d="M 30 20 C 30 20 100 20 130 20 C 175 20 205 50 205 95 C 205 140 175 170 130 170 L 80 170 L 80 240 L 30 240 Z" fill="url(#pDarkGrad)"/>
    <path d="M 80 65 L 125 65 C 140 65 155 75 155 95 C 155 115 140 125 125 125 L 80 125 Z" fill="#0B0F17"/>

    <!-- Interlocking Overlap Box -->
    <rect x="80" y="125" width="45" height="45" fill="url(#overlapDarkGrad)" rx="2"/>

    <!-- Edge Rim Lighting -->
    <path d="M 30 20 L 130 20 C 160 20 185 35 195 60 C 180 35 155 25 130 25 L 35 25 L 35 240 L 30 240 Z" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- Inverted White & Slate Typography -->
  <text x="250" y="380" class="dark-title-3d">PROMISIT</text>
  <text x="250" y="420" class="dark-sub-3d">DIGITAL SOLUTIONS</text>
</svg>
